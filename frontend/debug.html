<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 诊断工具</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .section { background: white; padding: 20px; margin: 15px 0; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        input { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 4px; }
        .output { background: #f8f9fa; padding: 15px; margin-top: 10px; border-radius: 4px; white-space: pre-wrap; font-family: monospace; font-size: 12px; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🔧 API 诊断工具</h1>

    <div class="section">
        <h3>1. 测试健康检查（无需认证）</h3>
        <button onclick="testHealth()">测试</button>
        <div id="healthOutput" class="output">点击按钮测试...</div>
    </div>

    <div class="section">
        <h3>2. 登录获取Token</h3>
        <input type="text" id="username" value="demo" placeholder="用户名">
        <input type="password" id="password" value="123456" placeholder="密码">
        <button onclick="login()">登录</button>
        <div id="loginOutput" class="output">点击登录...</div>
    </div>

    <div class="section">
        <h3>3. 测试设备API（需要认证）</h3>
        <button onclick="testDevices()">测试</button>
        <div id="devicesOutput" class="output">需要先登录</div>
    </div>

    <div class="section">
        <h3>4. 测试销售报表API（需要认证）</h3>
        <button onclick="testAnalytics()">测试</button>
        <div id="analyticsOutput" class="output">需要先登录</div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        let currentToken = null;

        async function testHealth() {
            const output = document.getElementById('healthOutput');
            output.textContent = '正在测试...';
            try {
                const response = await fetch(`${API_BASE}/auth/health`);
                const text = await response.text();
                output.innerHTML = `<span class="${response.ok ? 'success' : 'error'}">状态码: ${response.status}\n响应: ${text}</span>`;
            } catch (error) {
                output.innerHTML = `<span class="error">错误: ${error.message}</span>`;
            }
        }

        async function login() {
            const output = document.getElementById('loginOutput');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            output.textContent = '正在登录...';
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const text = await response.text();

                if (response.ok) {
                    const data = JSON.parse(text);
                    currentToken = data.token;
                    output.innerHTML = `<span class="success">登录成功！\n用户: ${data.user.username}\nToken: ${currentToken.substring(0, 50)}...</span>`;
                } else {
                    output.innerHTML = `<span class="error">登录失败: ${text}</span>`;
                }
            } catch (error) {
                output.innerHTML = `<span class="error">错误: ${error.message}</span>`;
            }
        }

        async function testDevices() {
            if (!currentToken) {
                document.getElementById('devicesOutput').innerHTML = '<span class="error">请先登录！</span>';
                return;
            }

            const output = document.getElementById('devicesOutput');
            output.textContent = '正在测试 /api/devices...\n';

            try {
                const response = await fetch(`${API_BASE}/devices`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const text = await response.text();

                output.textContent = `状态码: ${response.status}\n响应: ${text || '(空)'}`;

                if (response.ok) {
                    output.innerHTML = `<span class="success">${output.textContent}</span>`;
                } else if (response.status === 403) {
                    output.innerHTML = `<span class="error">❌ 403 权限不足！\n\n这说明Token被接受了，但是Spring Security拒绝了访问。\n\n可能原因:\n1. JWT filter工作正常\n2. 但是用户的角色权限不足\n3. 或者Security配置有问题</span>`;
                } else {
                    output.innerHTML = `<span class="error">${output.textContent}</span>`;
                }
            } catch (error) {
                output.innerHTML = `<span class="error">错误: ${error.message}</span>`;
            }
        }

        async function testAnalytics() {
            if (!currentToken) {
                document.getElementById('analyticsOutput').innerHTML = '<span class="error">请先登录！</span>';
                return;
            }

            const output = document.getElementById('analyticsOutput');
            output.textContent = '正在测试...';

            try {
                const response = await fetch(`${API_BASE}/analytics/sales-report?period=daily`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const text = await response.text();
                output.textContent = `状态码: ${response.status}\n响应: ${text || '(空)'}`;

                if (response.ok) {
                    output.innerHTML = `<span class="success">${output.textContent}</span>`;
                } else {
                    output.innerHTML = `<span class="error">${output.textContent}</span>`;
                }
            } catch (error) {
                output.innerHTML = `<span class="error">错误: ${error.message}</span>`;
            }
        }

        // 自动测试健康检查
        testHealth();
    </script>
</body>
</html>
