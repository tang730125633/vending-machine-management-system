<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能售货机管理系统 - 控制台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #f5f5f5;
        }

        .dashboard-container {
            display: flex;
            height: 100vh;
        }

        /* 侧边栏 */
        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, #f97316 0%, #c2410c 100%);
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 100;
        }

        .sidebar-header {
            padding: 25px 20px;
            background: rgba(0,0,0,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header h1 {
            font-size: 20px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header .subtitle {
            font-size: 12px;
            opacity: 0.8;
        }

        .nav-menu {
            flex: 1;
            overflow-y: auto;
            padding: 15px 0;
        }

        .nav-section {
            margin-bottom: 20px;
        }

        .nav-section-title {
            font-size: 11px;
            text-transform: uppercase;
            opacity: 0.6;
            padding: 10px 20px 5px;
            letter-spacing: 1px;
        }

        .nav-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.1);
            border-left-color: white;
        }

        .nav-item.active {
            background: rgba(255,255,255,0.15);
            border-left-color: white;
            font-weight: 600;
        }

        .nav-item .icon {
            font-size: 18px;
            width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            padding: 15px 20px;
            background: rgba(0,0,0,0.1);
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 12px;
            opacity: 0.7;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f5f5f5;
        }

        /* 顶部栏 */
        .topbar {
            height: 60px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .topbar-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }

        .breadcrumb {
            font-size: 13px;
            color: #999;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-controls {
            display: flex;
            gap: 5px;
        }

        .nav-btn {
            width: 32px;
            height: 32px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 14px;
        }

        .nav-btn:hover:not(:disabled) {
            background: #f5f5f5;
            border-color: #f97316;
            color: #f97316;
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .refresh-btn {
            padding: 8px 16px;
            background: #f97316;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: #ea580c;
            transform: translateY(-1px);
        }

        /* 内容iframe */
        .content-frame {
            flex: 1;
            background: white;
            margin: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .content-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 加载动画 */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #f97316;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 滚动条样式 */
        .nav-menu::-webkit-scrollbar {
            width: 6px;
        }

        .nav-menu::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }

        .nav-menu::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
        }

        .nav-menu::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- 侧边栏导航 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>🤖 售货机系统</h1>
                <div class="subtitle">Vending Machine System</div>
            </div>

            <div class="nav-menu">
                <!-- 主要功能 -->
                <div class="nav-section">
                    <div class="nav-section-title">主要功能</div>
                    <div class="nav-item active" data-page="admin.html" data-title="管理后台">
                        <span class="icon">📊</span>
                        <span>管理后台</span>
                    </div>
                    <div class="nav-item" data-page="index.html" data-title="登录页面">
                        <span class="icon">🏠</span>
                        <span>登录页面</span>
                    </div>
                </div>

                <!-- 用户管理 -->
                <div class="nav-section">
                    <div class="nav-section-title">用户管理</div>
                    <div class="nav-item" data-page="register.html" data-title="用户注册">
                        <span class="icon">📝</span>
                        <span>用户注册</span>
                    </div>
                    <div class="nav-item" data-page="approval.html" data-title="用户审核">
                        <span class="icon">✅</span>
                        <span>用户审核</span>
                    </div>
                </div>

                <!-- 业务管理 -->
                <div class="nav-section">
                    <div class="nav-section-title">业务管理</div>
                    <div class="nav-item" data-page="orders.html" data-title="订单管理">
                        <span class="icon">📦</span>
                        <span>订单管理</span>
                    </div>
                    <div class="nav-item" data-page="after-sales.html" data-title="售后管理">
                        <span class="icon">🔧</span>
                        <span>售后管理</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                版本 v1.0.0 | 2026-01-18
            </div>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 顶部栏 -->
            <div class="topbar">
                <div class="topbar-left">
                    <div class="topbar-title" id="pageTitle">管理后台</div>
                    <div class="breadcrumb">
                        <span>首页</span> / <span id="breadcrumbPage">管理后台</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="nav-controls">
                        <button class="nav-btn" id="backBtn" title="后退" disabled>
                            ◀
                        </button>
                        <button class="nav-btn" id="forwardBtn" title="前进" disabled>
                            ▶
                        </button>
                    </div>
                    <button class="refresh-btn" id="refreshBtn">
                        🔄 刷新页面
                    </button>
                </div>
            </div>

            <!-- 内容区 -->
            <div class="content-frame">
                <div class="loading active">
                    <div class="spinner"></div>
                    <p>加载中...</p>
                </div>
                <iframe id="contentFrame" src="admin.html"></iframe>
            </div>
        </div>
    </div>

    <script>
        // 历史记录管理
        let history = ['admin.html'];
        let currentIndex = 0;

        // DOM元素
        const navItems = document.querySelectorAll('.nav-item');
        const contentFrame = document.getElementById('contentFrame');
        const pageTitle = document.getElementById('pageTitle');
        const breadcrumbPage = document.getElementById('breadcrumbPage');
        const backBtn = document.getElementById('backBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const loading = document.querySelector('.loading');

        // 加载页面
        function loadPage(page, addToHistory = true) {
            // 显示加载动画
            loading.classList.add('active');

            // 加载页面
            contentFrame.src = page;

            // 添加到历史记录
            if (addToHistory) {
                // 清除前进历史
                history = history.slice(0, currentIndex + 1);
                history.push(page);
                currentIndex = history.length - 1;
            }

            // 更新导航按钮状态
            updateNavButtons();

            // 更新激活状态
            navItems.forEach(item => {
                if (item.dataset.page === page) {
                    item.classList.add('active');
                    const title = item.dataset.title;
                    pageTitle.textContent = title;
                    breadcrumbPage.textContent = title;
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // 更新导航按钮
        function updateNavButtons() {
            backBtn.disabled = currentIndex === 0;
            forwardBtn.disabled = currentIndex === history.length - 1;
        }

        // 导航项点击
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                const page = item.dataset.page;
                loadPage(page);
            });
        });

        // 后退
        backBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadPage(history[currentIndex], false);
            }
        });

        // 前进
        forwardBtn.addEventListener('click', () => {
            if (currentIndex < history.length - 1) {
                currentIndex++;
                loadPage(history[currentIndex], false);
            }
        });

        // 刷新
        refreshBtn.addEventListener('click', () => {
            contentFrame.src = contentFrame.src;
        });

        // iframe加载完成
        contentFrame.addEventListener('load', () => {
            loading.classList.remove('active');
        });

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            // Alt + Left: 后退
            if (e.altKey && e.key === 'ArrowLeft') {
                backBtn.click();
            }
            // Alt + Right: 前进
            if (e.altKey && e.key === 'ArrowRight') {
                forwardBtn.click();
            }
            // F5 或 Ctrl+R: 刷新
            if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
                e.preventDefault();
                refreshBtn.click();
            }
        });

        // 初始化
        updateNavButtons();
    </script>
</body>
</html>
