<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户中心 - 智能售货机管理系统</title>
    <style>
        :root {
            --primary-color: #f97316;
            --secondary-color: #c2410c;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --info-color: #17a2b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
        }

        .user-details h2 {
            color: #333;
            font-size: 22px;
            margin-bottom: 5px;
        }

        .user-details p {
            color: #666;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(249, 115, 22, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3);
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s;
            border-left: 4px solid;
        }

        .stat-card.orders {
            border-color: var(--primary-color);
        }

        .stat-card.aftersales {
            border-color: var(--warning-color);
        }

        .stat-card.points {
            border-color: var(--success-color);
        }

        .stat-card.coupons {
            border-color: var(--info-color);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .stat-card .icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .stat-card .label {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-card .value {
            color: #333;
            font-size: 28px;
            font-weight: 700;
        }

        .products-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h3 {
            color: #333;
            font-size: 20px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-bar input {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            width: 300px;
            font-size: 14px;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            transition: all 0.3s;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border-color: var(--primary-color);
        }

        .product-image {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin-bottom: 12px;
        }

        .product-name {
            color: #333;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .product-price {
            color: var(--danger-color);
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .product-stock {
            color: #666;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .stock-normal {
            color: var(--success-color);
        }

        .stock-low {
            color: var(--warning-color);
        }

        .stock-out {
            color: var(--danger-color);
        }

        .btn-buy {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-buy:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
        }

        .btn-buy:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert-success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .alert-danger {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 用户信息头部 -->
        <div class="header">
            <div class="user-info">
                <div class="avatar">👤</div>
                <div class="user-details">
                    <h2 id="userName">演示用户</h2>
                    <p>客户 | 会员等级：普通会员 | 积分：1280</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="window.location.href='customer-orders.html'">我的订单</button>
                <button class="btn btn-primary" onclick="window.location.href='customer-aftersales.html'">我的售后</button>
                <button class="btn btn-secondary" onclick="logout()">退出登录</button>
            </div>
        </div>

        <!-- 提示信息 -->
        <div id="alertBox" class="alert"></div>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card orders" onclick="window.location.href='customer-orders.html'">
                <div class="icon">📦</div>
                <div class="label">我的订单</div>
                <div class="value" id="orderCount">12</div>
            </div>
            <div class="stat-card aftersales" onclick="window.location.href='customer-aftersales.html'">
                <div class="icon">🔧</div>
                <div class="label">售后申请</div>
                <div class="value" id="aftersalesCount">2</div>
            </div>
            <div class="stat-card points">
                <div class="icon">⭐</div>
                <div class="label">我的积分</div>
                <div class="value" id="points">1280</div>
            </div>
            <div class="stat-card coupons">
                <div class="icon">🎫</div>
                <div class="label">优惠券</div>
                <div class="value" id="coupons">5</div>
            </div>
        </div>

        <!-- 商品浏览 -->
        <div class="products-section">
            <div class="section-header">
                <h3>🛒 商品浏览</h3>
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="搜索商品..." onkeyup="searchProducts()">
                    <button class="btn btn-primary" onclick="searchProducts()">搜索</button>
                </div>
            </div>

            <div class="products-grid" id="productsGrid">
                <!-- 商品卡片将通过JS动态生成 -->
            </div>
        </div>
    </div>

    <script>
        // 演示商品数据
        const demoProducts = [
            { id: 1, name: '可口可乐 500ml', price: 3.5, stock: 45, emoji: '🥤' },
            { id: 2, name: '农夫山泉 550ml', price: 2.0, stock: 60, emoji: '💧' },
            { id: 3, name: '统一冰红茶 500ml', price: 3.0, stock: 8, emoji: '🍵' },
            { id: 4, name: '乐事薯片 70g', price: 6.0, stock: 25, emoji: '🍟' },
            { id: 5, name: '康师傅方便面', price: 4.5, stock: 30, emoji: '🍜' },
            { id: 6, name: '士力架巧克力', price: 5.0, stock: 0, emoji: '🍫' },
            { id: 7, name: '奥利奥饼干', price: 7.5, stock: 15, emoji: '🍪' },
            { id: 8, name: '红牛功能饮料', price: 8.0, stock: 20, emoji: '🍺' }
        ];

        // 渲染商品列表
        function renderProducts(products = demoProducts) {
            const grid = document.getElementById('productsGrid');
            let html = '';

            products.forEach(product => {
                const stockStatus = product.stock > 10 ? 'normal' : product.stock > 0 ? 'low' : 'out';
                const stockText = product.stock > 10 ? `库存充足 (${product.stock})` :
                                 product.stock > 0 ? `库存紧张 (${product.stock})` : '已售罄';
                const stockClass = `stock-${stockStatus}`;
                const buyDisabled = product.stock === 0 ? 'disabled' : '';

                html += `
                    <div class="product-card">
                        <div class="product-image">${product.emoji}</div>
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">¥${product.price.toFixed(2)}</div>
                        <div class="product-stock ${stockClass}">${stockText}</div>
                        <button class="btn-buy" ${buyDisabled} onclick="buyProduct(${product.id})">
                            ${product.stock > 0 ? '立即购买' : '已售罄'}
                        </button>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        // 搜索商品
        function searchProducts() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            if (!keyword) {
                renderProducts();
                return;
            }

            const results = demoProducts.filter(p =>
                p.name.toLowerCase().includes(keyword)
            );

            renderProducts(results);
        }

        // 购买商品
        function buyProduct(productId) {
            const product = demoProducts.find(p => p.id === productId);
            if (!product) return;

            if (confirm(`确认购买 ${product.name}？\n价格：¥${product.price.toFixed(2)}`)) {
                // 模拟购买成功
                showAlert(`购买成功！订单已生成，请前往"我的订单"查看`, 'success');

                // 模拟库存扣减
                product.stock -= 1;
                renderProducts();

                // 更新订单数量
                const orderCount = document.getElementById('orderCount');
                orderCount.textContent = parseInt(orderCount.textContent) + 1;
            }
        }

        // 显示提示信息
        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = 'alert alert-' + type;
            alertBox.style.display = 'block';

            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }

        // 退出登录
        function logout() {
            if (confirm('确认退出登录？')) {
                window.location.href = 'index.html';
            }
        }

        // 页面加载时渲染商品
        window.onload = function() {
            renderProducts();
        };
    </script>
</body>
</html>
