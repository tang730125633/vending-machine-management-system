<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 智能售货机管理系统</title>
    <style>
        :root {
            --primary-color: #f97316;
            --secondary-color: #c2410c;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --info-color: #17a2b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .required {
            color: var(--danger-color);
            margin-left: 4px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .password-hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(249, 115, 22, 0.4);
        }

        .btn-demo {
            background: linear-gradient(135deg, var(--success-color) 0%, #20c997 100%);
            color: white;
        }

        .btn-demo:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            position: relative;
            color: #999;
            font-size: 13px;
        }

        .footer-links {
            text-align: center;
            margin-top: 20px;
        }

        .footer-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 14px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert-success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .alert-danger {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .demo-notice {
            background: linear-gradient(135deg, #fff3cd 0%, #ffe69c 100%);
            border: 2px dashed #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
        }

        .demo-notice p {
            color: #856404;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .demo-notice strong {
            color: #533f03;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🤖</div>
            <h1>用户注册</h1>
            <p class="subtitle">智能售货机管理系统</p>
        </div>

        <!-- 提示信息 -->
        <div id="alertBox" class="alert"></div>

        <!-- 加载动画 -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666;">注册中...</p>
        </div>

        <!-- 注册表单 -->
        <form id="registerForm">
            <div class="form-group">
                <label for="username">用户名<span class="required">*</span></label>
                <input type="text" id="username" name="username" required
                       placeholder="请输入用户名（4-20个字符）"
                       minlength="4" maxlength="20">
            </div>

            <div class="form-group">
                <label for="email">邮箱<span class="required">*</span></label>
                <input type="email" id="email" name="email" required
                       placeholder="请输入邮箱地址">
            </div>

            <div class="form-group">
                <label for="phone">手机号<span class="required">*</span></label>
                <input type="tel" id="phone" name="phone" required
                       placeholder="请输入手机号"
                       pattern="^1[3-9]\d{9}$">
            </div>

            <div class="form-group">
                <label for="realName">真实姓名<span class="required">*</span></label>
                <input type="text" id="realName" name="realName" required
                       placeholder="请输入真实姓名">
            </div>

            <div class="form-group">
                <label for="password">密码<span class="required">*</span></label>
                <input type="password" id="password" name="password" required
                       placeholder="请输入密码（至少6位）"
                       minlength="6">
                <p class="password-hint">密码长度至少6位，建议包含字母和数字</p>
            </div>

            <div class="form-group">
                <label for="confirmPassword">确认密码<span class="required">*</span></label>
                <input type="password" id="confirmPassword" name="confirmPassword" required
                       placeholder="请再次输入密码"
                       minlength="6">
            </div>

            <div class="form-group">
                <label for="role">申请角色<span class="required">*</span></label>
                <select id="role" name="role" required>
                    <option value="">请选择角色</option>
                    <option value="CUSTOMER">客户（购买商品）</option>
                    <option value="OPERATOR">运营人员（设备补货、售后处理）</option>
                    <option value="TECHNICIAN">技术人员（设备维修）</option>
                    <option value="ADMIN">管理员（需要审核）</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">立即注册</button>

            <div class="divider">
                <span>或</span>
            </div>

            <button type="button" class="btn btn-demo" onclick="enterDemoMode()">
                🚀 进入演示模式（无需注册）
            </button>
        </form>

        <!-- 演示模式提示 -->
        <div id="demoNotice" class="demo-notice" style="display: none;">
            <p><strong>演示模式已激活</strong></p>
            <p>注册成功！您的账号正在等待管理员审核...</p>
            <p style="margin-top: 10px;">
                <a href="login.html" style="color: #533f03; font-weight: 600;">返回登录页面</a>
            </p>
        </div>

        <div class="footer-links">
            已有账号？<a href="login.html">立即登录</a>
        </div>
    </div>

    <script>
        // 演示模式标志
        let isDemoMode = false;

        // 进入演示模式
        function enterDemoMode() {
            isDemoMode = true;
            showAlert('演示模式已启用，提交注册后将显示模拟结果', 'success');

            // 自动填充演示数据
            document.getElementById('username').value = 'demo_user_' + Math.floor(Math.random() * 1000);
            document.getElementById('email').value = 'demo@example.com';
            document.getElementById('phone').value = '13800138000';
            document.getElementById('realName').value = '演示用户';
            document.getElementById('password').value = 'demo123456';
            document.getElementById('confirmPassword').value = 'demo123456';
            document.getElementById('role').value = 'CUSTOMER';
        }

        // 表单提交
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // 获取表单数据
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const realName = document.getElementById('realName').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.getElementById('role').value;

            // 表单验证
            if (!username || !email || !phone || !realName || !password || !confirmPassword || !role) {
                showAlert('请填写所有必填项', 'danger');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('两次输入的密码不一致', 'danger');
                return;
            }

            if (password.length < 6) {
                showAlert('密码长度至少6位', 'danger');
                return;
            }

            // 手机号验证
            const phoneRegex = /^1[3-9]\d{9}$/;
            if (!phoneRegex.test(phone)) {
                showAlert('手机号格式不正确', 'danger');
                return;
            }

            // 邮箱验证
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showAlert('邮箱格式不正确', 'danger');
                return;
            }

            // 显示加载动画
            document.getElementById('loading').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';

            if (isDemoMode) {
                // 演示模式：模拟注册成功
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('demoNotice').style.display = 'block';
                    showAlert('注册成功！您的账号正在等待管理员审核，审核通过后即可登录。', 'success');
                }, 1500);
            } else {
                // 真实模式：调用后端API
                const registerData = {
                    username: username,
                    email: email,
                    phone: phone,
                    realName: realName,
                    password: password,
                    role: role
                };

                fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(registerData)
                })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(err.message || '注册失败');
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    showAlert('注册成功！您的账号正在等待管理员审核，审核通过后即可登录。', 'success');

                    // 3秒后跳转到登录页
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);
                })
                .catch(error => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('registerForm').style.display = 'block';
                    showAlert(error.message || '注册失败，请重试', 'danger');
                });
            }
        });

        // 显示提示信息
        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = 'alert alert-' + type;
            alertBox.style.display = 'block';

            // 3秒后自动隐藏
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }

        // 密码确认实时验证
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;

            if (confirmPassword && password !== confirmPassword) {
                this.style.borderColor = 'var(--danger-color)';
            } else {
                this.style.borderColor = '#e0e0e0';
            }
        });
    </script>
</body>
</html>
