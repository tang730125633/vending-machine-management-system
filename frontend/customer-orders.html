<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 智能售货机管理系统</title>
    <style>
        :root {
            --primary-color: #f97316;
            --secondary-color: #c2410c;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --info-color: #17a2b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #333;
            font-size: 24px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(249, 115, 22, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3);
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .filter-bar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            color: #666;
            font-size: 13px;
            font-weight: 500;
        }

        .filter-group select,
        .filter-group input {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .orders-list {
            display: grid;
            gap: 15px;
        }

        .order-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }

        .order-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: 15px;
        }

        .order-number {
            font-size: 14px;
            color: #666;
        }

        .order-time {
            font-size: 13px;
            color: #999;
        }

        .order-body {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 15px;
            align-items: center;
        }

        .product-icon {
            font-size: 48px;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 12px;
        }

        .product-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .product-details {
            font-size: 14px;
            color: #666;
        }

        .order-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }

        .order-price {
            font-size: 24px;
            font-weight: 700;
            color: var(--danger-color);
        }

        .order-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .btn-small {
            padding: 6px 14px;
            font-size: 13px;
        }

        .empty-state {
            background: white;
            border-radius: 12px;
            padding: 60px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state p {
            color: #999;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 页面头部 -->
        <div class="header">
            <h1>📦 我的订单</h1>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" onclick="window.location.href='customer-home.html'">返回首页</button>
                <button class="btn btn-secondary" onclick="window.location.href='customer-aftersales.html'">我的售后</button>
            </div>
        </div>

        <!-- 筛选栏 -->
        <div class="filter-bar">
            <div class="filter-group">
                <label>订单状态</label>
                <select id="filterStatus" onchange="filterOrders()">
                    <option value="">全部订单</option>
                    <option value="COMPLETED">已完成</option>
                    <option value="PENDING">待处理</option>
                    <option value="CANCELLED">已取消</option>
                </select>
            </div>
            <div class="filter-group">
                <label>开始日期</label>
                <input type="date" id="filterStartDate" onchange="filterOrders()">
            </div>
            <div class="filter-group">
                <label>结束日期</label>
                <input type="date" id="filterEndDate" onchange="filterOrders()">
            </div>
            <button class="btn btn-primary" onclick="resetFilters()">重置筛选</button>
        </div>

        <!-- 订单列表 -->
        <div class="orders-list" id="ordersList">
            <!-- 订单卡片将通过JS动态生成 -->
        </div>

        <!-- 空状态 -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="icon">📭</div>
            <p>暂无订单记录</p>
        </div>
    </div>

    <script>
        // 演示订单数据
        const demoOrders = [
            {
                id: 'ORD202601180001',
                productName: '可口可乐 500ml',
                emoji: '🥤',
                quantity: 2,
                price: 7.0,
                deviceName: '朝阳店-01号机',
                deviceLocation: '朝阳区建国路88号',
                paymentMethod: '微信支付',
                status: 'COMPLETED',
                createTime: '2026-01-18 14:30:25'
            },
            {
                id: 'ORD202601180002',
                productName: '乐事薯片 70g',
                emoji: '🍟',
                quantity: 1,
                price: 6.0,
                deviceName: '海淀店-02号机',
                deviceLocation: '海淀区中关村大街1号',
                paymentMethod: '支付宝',
                status: 'COMPLETED',
                createTime: '2026-01-18 12:15:10'
            },
            {
                id: 'ORD202601170003',
                productName: '农夫山泉 550ml',
                emoji: '💧',
                quantity: 3,
                price: 6.0,
                deviceName: '丰台店-03号机',
                deviceLocation: '丰台区南三环路12号',
                paymentMethod: '微信支付',
                status: 'COMPLETED',
                createTime: '2026-01-17 16:45:30'
            },
            {
                id: 'ORD202601170004',
                productName: '统一冰红茶 500ml',
                emoji: '🍵',
                quantity: 1,
                price: 3.0,
                deviceName: '朝阳店-01号机',
                deviceLocation: '朝阳区建国路88号',
                paymentMethod: '支付宝',
                status: 'PENDING',
                createTime: '2026-01-17 10:20:00'
            },
            {
                id: 'ORD202601160005',
                productName: '康师傅方便面',
                emoji: '🍜',
                quantity: 2,
                price: 9.0,
                deviceName: '西城店-05号机',
                deviceLocation: '西城区金融街9号',
                paymentMethod: '微信支付',
                status: 'COMPLETED',
                createTime: '2026-01-16 09:30:15'
            }
        ];

        let filteredOrders = [...demoOrders];

        // 渲染订单列表
        function renderOrders(orders = filteredOrders) {
            const ordersList = document.getElementById('ordersList');
            const emptyState = document.getElementById('emptyState');

            if (orders.length === 0) {
                ordersList.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            ordersList.style.display = 'grid';
            emptyState.style.display = 'none';

            let html = '';
            orders.forEach(order => {
                const statusClass = `status-${order.status.toLowerCase()}`;
                const statusText = {
                    'COMPLETED': '已完成',
                    'PENDING': '待处理',
                    'CANCELLED': '已取消'
                }[order.status];

                html += `
                    <div class="order-card">
                        <div class="order-header">
                            <span class="order-number">订单号：${order.id}</span>
                            <span class="order-time">${order.createTime}</span>
                        </div>
                        <div class="order-body">
                            <div class="product-icon">${order.emoji}</div>
                            <div class="product-info">
                                <div class="product-name">${order.productName}</div>
                                <div class="product-details">数量：${order.quantity} | 支付方式：${order.paymentMethod}</div>
                                <div class="product-details">设备：${order.deviceName}</div>
                                <div class="product-details">位置：${order.deviceLocation}</div>
                            </div>
                            <div class="order-actions">
                                <div class="order-price">¥${order.price.toFixed(2)}</div>
                                <span class="order-status ${statusClass}">${statusText}</span>
                                ${order.status === 'COMPLETED' ? `
                                    <button class="btn btn-secondary btn-small" onclick="applyAftersales('${order.id}')">
                                        申请售后
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });

            ordersList.innerHTML = html;
        }

        // 筛选订单
        function filterOrders() {
            const status = document.getElementById('filterStatus').value;
            const startDate = document.getElementById('filterStartDate').value;
            const endDate = document.getElementById('filterEndDate').value;

            filteredOrders = demoOrders.filter(order => {
                // 状态筛选
                if (status && order.status !== status) return false;

                // 日期筛选
                const orderDate = new Date(order.createTime).toISOString().split('T')[0];
                if (startDate && orderDate < startDate) return false;
                if (endDate && orderDate > endDate) return false;

                return true;
            });

            renderOrders();
        }

        // 重置筛选
        function resetFilters() {
            document.getElementById('filterStatus').value = '';
            document.getElementById('filterStartDate').value = '';
            document.getElementById('filterEndDate').value = '';
            filteredOrders = [...demoOrders];
            renderOrders();
        }

        // 申请售后
        function applyAftersales(orderId) {
            if (confirm('确认要为此订单申请售后吗？')) {
                // 跳转到售后页面，并传递订单ID
                window.location.href = `customer-aftersales.html?orderId=${orderId}`;
            }
        }

        // 页面加载时渲染订单
        window.onload = function() {
            renderOrders();
        };
    </script>
</body>
</html>
