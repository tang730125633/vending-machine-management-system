spring:
  application:
    name: vending-machine-management
  main:
    allow-circular-references: true

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/vending_machine_db?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    generator:
      escape-non-ascii: false

server:
  port: 8080
  servlet:
    context-path: /api
  http:
    encoding:
      charset: UTF-8
      force: true

# JWT配置
jwt:
  secret: your_jwt_secret_key_change_in_production
  expiration: 604800000 # 7天（毫秒）

# 文件上传配置
file:
  upload-dir: ./uploads

# AI模型配置
ai:
  enabled: true
  model-path: ./ai_models

logging:
  level:
    com.vending: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO

